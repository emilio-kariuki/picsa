name: Android Release and Play Store deploy

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: 🤖 Cache Java and Flutter Setup
        uses: actions/cache@v3
        with:
          path: |
            ~/.sdkman/candidates/java
            ~/.pub-cache
          key: ${{ runner.os }}-java-zulu-17-flutter-stable-3.22.0-${{ hashFiles('**/build.gradle', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-java-zulu-17-
            ${{ runner.os }}-flutter-stable-3.22.0-

      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "17.x"

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.22.0

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1

      - name: 🚀 Use Shorebird
        run: shorebird --version

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Download and Set Permissions for Android keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > android/app/key.jks
          chmod 600 android/app/key.jks

      - name: Create key.properties
        run: |
          echo "storeFile=key.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> android/key.properties

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Cache Flutter Dependencies
        uses: actions/cache@v2
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-dependencies-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-dependencies-

  generate-app-bundle:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.22.0

      - name: 🚗 Build Android Release
        run: flutter build appbundle --release
  
  generate-app-apk:
    runs-on: ubuntu-latest
    needs: generate-app-bundle

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.22.0

      - name: 🚗 Build Android Release
        run: flutter build apk --release

  shorebird-release:
    runs-on: ubuntu-latest
    needs: generate-app-bundle

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.22.0

      - name: 🚀 Shorebird Release
        uses: shorebirdtech/shorebird-release@v0
        id: shorebird-release
        with:
          platform: android
          working-directory: build/app
  
  distribution:
    runs-on: ubuntu-latest
    needs: shorebird-release

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: "17.x"
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.22.0

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          groups: internal
          releaseNotesFile: distribution/whatsnew/whatsnew.txt
          file: build/app/outputs/bundle/release/release.apk
          serviceCredentialsFile: https://utfs.io/f/OEW0NXofdQiaJpD2lUcGhRIegrtG08X6VUOaoNFu7fBJxvLp

  deploy:
    runs-on: ubuntu-latest
    needs: distribution

    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.22.0

      - name: Create service_account.json
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Create 'whatsnew' Directory
        run: mkdir -p distribution/

      - name: ⛵️ Deploy to Internal Sharing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: com.ecoville.picsa
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          whatsNewDirectory: distribution/