  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.9
  gap: ^3.0.1
  get_it: ^7.7.0
  go_router: ^13.2.0
  google_fonts: ^6.1.0
  google_sign_in: ^6.2.1
